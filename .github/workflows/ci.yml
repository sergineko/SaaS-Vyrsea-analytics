name: Validate Vyrsea

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vyrsea_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vyrsea_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      VYRSEA_POSTGRES_TEST_URL: postgresql://postgres:local_test_only@127.0.0.1:5432/vyrsea_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck, integration tests and production build
        run: pnpm run check
